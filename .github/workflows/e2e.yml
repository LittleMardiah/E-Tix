name: E2E (Playwright)

on:
  push:
    branches:
      - main

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etix_flash_e2e
        ports:
          - 15433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.12-alpine
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:15433/etix_flash_e2e?sslmode=disable
      REDIS_URL: redis://localhost:16379
      RABBITMQ_URL: amqp://guest:guest@localhost:5673/
      # Absolute paths only: `runner.*` context is NOT allowed in job-level
      # env (GitHub rejects it with "Unrecognized named-value: 'runner'"); it
      # is only available inside step-level fields.
      JWT_PRIVATE_KEY_PATH: /tmp/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /tmp/jwt/public.pem
      TEST_MODE: "true"
      LOG_LEVEL: info
      ENV: test
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: task spec says Go 1.22, but backend/go.mod requires 1.26.10.
      # Code is the source of truth (R2), so the toolchain follows go.mod.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Backend only accepts PKCS8 private key + PKIX public key paths.
      - name: Generate JWT keys
        run: |
          mkdir -p /tmp/jwt
          openssl genrsa -out /tmp/jwt/private.pem 2048
          openssl rsa -in /tmp/jwt/private.pem -pubout -out /tmp/jwt/public.pem
          ls -la /tmp/jwt

      - name: Run migrations
        working-directory: backend
        run: go run ./cmd/migrate -path ./migrations -database "$DATABASE_URL" up

      - name: Seed CI Database
        run: PGPASSWORD=postgres psql -h localhost -p 15433 -U postgres -d etix_flash_e2e -v ON_ERROR_STOP=1 -f backend/tests/fixtures/seed_ci.sql

      - name: Inject Redis Quota
        run: |
          sudo apt-get update && sudo apt-get install -y redis-tools
          redis-cli -h localhost -p 16379 SET "quota:33333333-3333-3333-3333-333333333333:VIP" 10

      - name: Start backend
        working-directory: backend
        run: |
          nohup go run ./cmd/api > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz/readiness > /dev/null; then
              echo "backend ready after ${i} attempt(s)"
              cat "$RUNNER_TEMP/backend.log"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        # Explicit: job-level env no longer leaks the backend port into `next start`.
        env:
          PORT: "3000"
        run: |
          nohup npm start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "frontend ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "frontend did not become ready"
          cat "$RUNNER_TEMP/frontend.log"
          exit 1

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "===== backend.log ====="
          cat "$RUNNER_TEMP/backend.log" || true
          echo "===== frontend.log ====="
          cat "$RUNNER_TEMP/frontend.log" || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
