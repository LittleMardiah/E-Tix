name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  backend-unit:
    runs-on: ubuntu-latest
    services:
      # FIX P9a-9 TD-014: unit suite includes DB-backed repository tests
      # (internal/<pkg>/*_test.go). They skip when TEST_DB_URL is unset, so a
      # missing service degrades coverage instead of failing the job.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etix_flash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run migrations
        env:
          TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/etix_flash_test?sslmode=disable
        run: go run ./cmd/migrate -database "$TEST_DB_URL" up

      - name: Unit tests
        env:
          TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/etix_flash_test?sslmode=disable
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.out
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: backend
        run: govulncheck ./...

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etix_flash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run migrations
        env:
          TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/etix_flash_test?sslmode=disable
        run: |
          go run ./cmd/migrate -database "$TEST_DB_URL" up

      - name: Run integration tests
        env:
          TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/etix_flash_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: go test -p 1 -tags integration -coverpkg=./internal/... -cover -count=1 ./tests/integration/...

  # FIX P9a-9 TD-014: API contract tests (Newman).
  # Disabled by default: enable with repo variable ENABLE_API_CONTRACT=true
  # and secret STAGING_API_URL pointing at a deployed instance.
  api-contract:
    name: API Contract (Newman)
    runs-on: ubuntu-latest
    needs: [backend-unit]
    if: ${{ vars.ENABLE_API_CONTRACT == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Newman
        run: npm install -g newman newman-reporter-html
      - name: Run collection
        run: |
          newman run backend/postman_collection.json \
            --env-var baseUrl=${{ secrets.STAGING_API_URL }} \
            --reporters cli,html \
            --reporter-html-export newman-report.html
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: newman-report.html
  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install Dependencies
        run: npm ci
      - name: Type Check & Lint
        run: npx tsc --noEmit && npm run lint
      - name: Build Next.js
        run: npm run build
